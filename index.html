<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Theo dõi nhà Hà Nội</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1a1d21; --muted:#6b7280;
    --border:#e3e6ea; --accent:#0b7285; --accent-soft:#e6f4f7;
    --danger:#c92a2a; --danger-soft:#fdecec; --ok:#2b8a3e; --ok-soft:#e6f4ea;
    --chip:#eef1f4; --star:#e8a100; --zalo:#0068ff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#121417; --card:#1c1f24; --text:#eceff3; --muted:#9aa3ad;
      --border:#2c3038; --accent:#3bc9db; --accent-soft:#12333a;
      --danger:#ff8787; --danger-soft:#3d1d1d; --ok:#69db7c; --ok-soft:#17351f;
      --chip:#262a31; --star:#ffd43b;
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px; line-height:1.45;
    padding-bottom:calc(64px + env(safe-area-inset-bottom));
  }
  header{
    position:sticky; top:0; z-index:20;
    background:var(--card); border-bottom:1px solid var(--border);
    padding:10px 14px;
  }
  header h1{font-size:18px; margin:0 0 2px}
  .summary{font-size:13px; color:var(--muted)}
  .summary b{color:var(--text)}
  .updated{font-size:12px; color:var(--muted); margin-top:2px}
  button{
    font:inherit; cursor:pointer; border:1px solid var(--border);
    background:var(--card); color:var(--text); border-radius:10px;
    padding:10px 14px; min-height:44px;
  }
  button:active{transform:scale(.97)}
  main{padding:12px 12px 26px; max-width:860px; margin:0 auto}
  .state{text-align:center; color:var(--muted); padding:44px 20px; font-size:15px}
  .state .big{font-size:17px; color:var(--text); font-weight:600; margin-bottom:6px}

  /* ===== Deck (Tinder) ===== */
  .deckwrap{max-width:560px; margin:0 auto}
  .deckmeta{display:flex; justify-content:space-between; align-items:center; font-size:13.5px; color:var(--muted); margin:2px 2px 10px}
  .deckmeta button{min-height:36px; padding:6px 12px; font-size:13.5px}
  .stage{position:relative; min-height:200px}
  .dcard{
    background:var(--card); border:1px solid var(--border); border-radius:18px;
    overflow:hidden; box-shadow:0 8px 28px rgba(0,0,0,.10);
    touch-action:pan-y; user-select:none; -webkit-user-select:none;
    will-change:transform;
  }
  .dcard.behind{position:absolute; inset:0; transform:scale(.95) translateY(10px); z-index:-1; box-shadow:none}
  .photo{position:relative; background:var(--chip); aspect-ratio:4/3; overflow:hidden}
  .photo img{width:100%; height:100%; object-fit:cover; display:block; pointer-events:none}
  .photo .nophoto{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:15px; padding:20px; text-align:center;
  }
  .photo .count{
    position:absolute; right:10px; top:10px; background:rgba(0,0,0,.55); color:#fff;
    font-size:12.5px; border-radius:999px; padding:3px 10px;
  }
  .photo .nav{
    position:absolute; top:50%; transform:translateY(-50%);
    width:42px; height:42px; border-radius:50%; border:none;
    background:rgba(0,0,0,.45); color:#fff; font-size:22px; line-height:1;
    display:flex; align-items:center; justify-content:center; min-height:42px; padding:0;
  }
  .photo .nav.prev{left:8px} .photo .nav.next{right:8px}
  .photo .dots{position:absolute; left:0; right:0; bottom:8px; display:flex; gap:5px; justify-content:center}
  .photo .dots i{width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.55)}
  .photo .dots i.on{background:#fff}
  .stamp{
    position:absolute; top:16px; font-size:21px; font-weight:800; letter-spacing:.5px;
    border:3px solid; border-radius:10px; padding:3px 12px; opacity:0; pointer-events:none;
    background:rgba(255,255,255,.85);
  }
  .stamp.save{left:14px; color:var(--ok); border-color:var(--ok); transform:rotate(-12deg)}
  .stamp.pass{right:14px; color:var(--danger); border-color:var(--danger); transform:rotate(12deg)}
  .dbody{padding:13px 15px 15px}
  .dprice{font-size:23px; font-weight:800; line-height:1.15}
  .dperm2{font-size:13.5px; color:var(--muted); font-weight:500}
  .dtitle{font-size:16.5px; font-weight:600; margin:7px 0 4px}
  .dmeta{font-size:14px; color:var(--muted); display:flex; flex-wrap:wrap; gap:3px 12px}
  .dnote{font-size:15px; margin-top:8px; white-space:pre-wrap}
  .badge-loai{
    display:inline-block; background:var(--danger); color:#fff;
    font-size:12px; font-weight:700; border-radius:7px; padding:3px 8px; margin-left:8px; vertical-align:3px;
  }
  .dactions{display:flex; gap:10px; margin-top:14px}
  .dactions a{
    flex:1; text-align:center; text-decoration:none; font-weight:600;
    border-radius:10px; padding:11px 6px; min-height:46px;
    display:flex; align-items:center; justify-content:center; font-size:14.5px;
  }
  .a-fb{background:var(--accent); color:#fff}
  .a-call{background:var(--chip); color:var(--text); border:1px solid var(--border)}
  .a-zalo{background:var(--zalo); color:#fff}
  .swipebar{
    display:flex; justify-content:center; align-items:center; gap:18px; margin-top:16px;
  }
  .sbtn{
    width:62px; height:62px; border-radius:50%; font-size:26px; line-height:1;
    display:flex; align-items:center; justify-content:center; padding:0; min-height:62px;
    box-shadow:0 4px 14px rgba(0,0,0,.12);
  }
  .sbtn.pass{color:var(--danger); border-color:var(--danger)}
  .sbtn.save{color:var(--ok); border-color:var(--ok); width:70px; height:70px; min-height:70px; font-size:30px}
  .sbtn.star{color:var(--star); border-color:var(--star)}
  .sbtn.star.on{background:var(--star); color:#fff}
  .swipelabels{display:flex; justify-content:center; gap:18px; margin-top:6px; font-size:12px; color:var(--muted)}
  .swipelabels span{width:62px; text-align:center}
  .swipelabels span.mid{width:70px}

  /* ===== List ===== */
  .searchrow{display:flex; gap:8px; margin:4px 0 10px}
  .searchrow input[type=search]{
    flex:1; min-width:0; font-size:16px; padding:11px 12px;
    border:1px solid var(--border); border-radius:10px; background:var(--card); color:var(--text);
  }
  .filters{display:none; padding:2px 0 8px}
  .filters.open{display:block}
  .filters .row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; align-items:center}
  .filters label{font-size:13px; color:var(--muted); width:100%}
  select, .filters input[type=number]{
    font-size:16px; padding:9px 10px; border:1px solid var(--border);
    border-radius:9px; background:var(--card); color:var(--text); max-width:100%;
  }
  .toggle{
    display:inline-flex; align-items:center; gap:7px;
    background:var(--chip); border:1px solid var(--border);
    border-radius:999px; padding:8px 13px; font-size:14px; min-height:40px; cursor:pointer; user-select:none;
  }
  .toggle.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:13px 14px; margin-bottom:11px; position:relative;
  }
  .card.loai{border-color:var(--danger)}
  .top{display:flex; align-items:flex-start; gap:10px}
  .rank{
    flex:0 0 auto; background:var(--accent-soft); color:var(--accent);
    font-weight:700; font-size:13px; border-radius:8px; padding:3px 8px; margin-top:2px;
  }
  .price{font-size:21px; font-weight:800; line-height:1.15}
  .perm2{font-size:13px; color:var(--muted); font-weight:500}
  .starb{
    margin-left:auto; flex:0 0 auto; border:none; background:none; font-size:24px;
    color:var(--muted); padding:2px 6px; min-height:0; line-height:1;
  }
  .starb.on{color:var(--star)}
  .gallery{display:flex; gap:8px; overflow-x:auto; padding:10px 0 2px; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch}
  .gallery img{height:180px; width:auto; max-width:85%; object-fit:cover; flex:0 0 auto; border-radius:10px; scroll-snap-align:start; background:var(--chip)}
  .title{font-size:16px; font-weight:600; margin:8px 0 4px}
  .meta{font-size:14px; color:var(--muted); display:flex; flex-wrap:wrap; gap:3px 12px}
  .note{font-size:15px; margin-top:8px; white-space:pre-wrap}
  .comment{font-size:14px; margin-top:8px; background:var(--accent-soft); border-radius:9px; padding:8px 10px; white-space:pre-wrap}
  .comment .lbl{font-size:12px; font-weight:700; color:var(--accent); display:block; margin-bottom:2px}
  .badges{display:flex; gap:7px; margin-top:10px; flex-wrap:wrap}
  .bdg{font-size:13px; border-radius:999px; padding:4px 11px; background:var(--chip); color:var(--muted)}
  .bdg.done{background:var(--ok-soft); color:var(--ok); font-weight:600}
  .actions{display:flex; gap:8px; margin-top:11px}
  .actions a{
    flex:1; text-align:center; text-decoration:none; font-weight:600;
    border-radius:10px; padding:12px 8px; min-height:48px; font-size:14.5px;
    display:flex; align-items:center; justify-content:center;
  }
  .mini{font-size:13px; color:var(--muted); margin-top:8px}

  /* ===== Bottom tabs ===== */
  nav.tabs{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:var(--card); border-top:1px solid var(--border);
    display:flex; padding-bottom:env(safe-area-inset-bottom);
  }
  nav.tabs button{
    flex:1; border:none; background:none; border-radius:0; min-height:56px;
    font-size:14px; color:var(--muted); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1px; padding:6px 0;
  }
  nav.tabs button .ic{font-size:21px; line-height:1}
  nav.tabs button.on{color:var(--accent); font-weight:700}
  footer{max-width:860px; margin:0 auto; padding:0 16px 20px; color:var(--muted); font-size:12.5px}
</style>
</head>
<body>
<header>
  <h1>Theo dõi nhà Hà Nội</h1>
  <div class="summary" id="summary">Đang tải dữ liệu…</div>
  <div class="updated" id="updated"></div>
</header>

<main id="view"></main>

<footer>
  Dữ liệu đọc trực tiếp từ Google Sheet “Tìm nhà Hà Nội — Nino 2026”, tab “Nhà trên Facebook” (cột Ảnh lấy link ảnh từ Sheet).
  Lượt vuốt / lưu / sao được lưu trên chính thiết bị đang xem.
</footer>

<nav class="tabs">
  <button id="tabDeck" type="button"><span class="ic">🂡</span>Vuốt xem</button>
  <button id="tabSaved" type="button"><span class="ic">♥</span>Đã lưu</button>
  <button id="tabList" type="button"><span class="ic">☰</span>Danh sách</button>
</nav>

<script>
"use strict";
/* ====== CẤU HÌNH ====== */
const SHEET_ID = "1Te44C8dwth9vSWuEX1BxI0s3V_sWi-OgSajlrIZtEa8";
const TAB_NAME = "Nhà trên Facebook";
/* Cột Sheet: A Giá | B Ngày đăng | C Tiêu đề | D Diện tích | E Khu vực | F SĐT |
   G Ghi chú | H Link | I Đã nhắn | J Đã check | K Comment | L Ảnh (link, cách nhau bởi dấu cách/xuống dòng) */

const state = {
  houses: [], tab: "deck",
  q: "", area: "", maxPrice: null, sort: "rank", hideLoai: false,
  photoIdx: 0, history: []
};

/* ===== Lưu trên thiết bị: bỏ qua / đã lưu / sao ===== */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let passed = new Set(store.get("tdh_passed", []));
let saved = new Set(store.get("tdh_saved", []));
let starred = new Set(store.get("tdh_starred", []));
function persist() {
  store.set("tdh_passed", [...passed]);
  store.set("tdh_saved", [...saved]);
  store.set("tdh_starred", [...starred]);
}

const $ = (id) => document.getElementById(id);
function houseId(link) {
  if (!link) return "";
  const m = String(link).match(/permalink\/(\d+)/) ||
            String(link).match(/marketplace\/item\/(\d+)/) ||
            String(link).match(/fbid=(\d+)/);
  return m ? m[1] : String(link);
}
function parsePrice(text) {
  if (text == null) return null;
  const m = String(text).replace(/\s/g, "").match(/(\d+(?:[.,]\d+)?)/);
  if (!m) return null;
  const v = parseFloat(m[1].replace(",", "."));
  return isNaN(v) ? null : v;
}
function cellVal(cell) {
  if (!cell) return "";
  if (cell.f != null) return String(cell.f);
  if (cell.v == null) return "";
  if (typeof cell.v === "string" && cell.v.startsWith("Date(")) {
    const p = cell.v.match(/\d+/g).map(Number);
    if (p.length >= 3) {
      const dd = String(p[2]).padStart(2, "0");
      const mm = String(p[1] + 1).padStart(2, "0");
      return dd + "/" + mm + "/" + p[0];
    }
  }
  return String(cell.v);
}
function cellBool(cell) { return !!(cell && (cell.v === true || String(cell.v).toLowerCase() === "true")); }
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function normPhone(phone) {
  let d = String(phone || "").replace(/\D/g, "");
  if (d.length === 9) d = "0" + d; // Sheet mất số 0 đầu
  return d;
}
function isLoai(h) { return /LOẠI/.test(h.note || ""); }
function perm2(h) { return (h.priceNum != null && h.areaSqm) ? Math.round(h.priceNum * 1000 / h.areaSqm) + " tr/m²" : ""; }

async function load() {
  $("view").innerHTML = '<div class="state"><div class="big">Đang tải danh sách từ Google Sheet…</div>Vui lòng chờ giây lát.</div>';
  const url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
    "/gviz/tq?tqx=out:json&sheet=" + encodeURIComponent(TAB_NAME);
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    const start = text.indexOf("{"), end = text.lastIndexOf("}");
    if (start < 0 || end < 0) throw new Error("bad response");
    const data = JSON.parse(text.slice(start, end + 1));
    if (!data.table || !data.table.rows) throw new Error("no table");
    const houses = [];
    data.table.rows.forEach((row, idx) => {
      const c = row.c || [];
      const title = cellVal(c[2]);
      const link = cellVal(c[7]);
      if (idx === 0 && /tiêu đề/i.test(title)) return;
      if (!title && !link) return;
      const priceText = cellVal(c[0]);
      const areaSqm = parseFloat(String(cellVal(c[3])).replace(",", "."));
      const imgs = cellVal(c[11]).split(/[\s,]+/).filter(u => /^https?:\/\//.test(u));
      houses.push({
        rank: houses.length + 1,
        id: houseId(link),
        priceText, priceNum: parsePrice(priceText),
        postedDate: cellVal(c[1]),
        title,
        areaSqm: isNaN(areaSqm) ? null : areaSqm,
        area: cellVal(c[4]),
        phone: cellVal(c[5]),
        note: cellVal(c[6]),
        link,
        daNhan: cellBool(c[8]),
        daCheck: cellBool(c[9]),
        comment: cellVal(c[10]),
        images: imgs
      });
    });
    state.houses = houses;
    const now = new Date();
    $("updated").textContent = "Đã tải lúc " + now.toLocaleTimeString("vi-VN") +
      " ngày " + now.toLocaleDateString("vi-VN") + " — dữ liệu mới nhất từ Sheet";
    render();
  } catch (e) {
    $("summary").textContent = "Không tải được dữ liệu";
    $("view").innerHTML =
      '<div class="state"><div class="big">Chưa đọc được Google Sheet</div>' +
      'Trang cần Sheet được bật chia sẻ <b>“Bất kỳ ai có đường liên kết đều xem được”</b>.<br><br>' +
      '<button type="button" onclick="load()">Thử lại</button></div>';
  }
}

/* ===== Thẻ dùng chung ===== */
function contactRow(h) {
  const d = normPhone(h.phone);
  return '<div class="actions">' +
    (h.link ? '<a class="a-fb" href="' + esc(h.link) + '" target="_blank" rel="noopener">Mở tin</a>' : '') +
    (d ? '<a class="a-call" href="tel:' + d + '">Gọi ' + esc(h.phone) + '</a>' : '') +
    (d ? '<a class="a-zalo" href="https://zalo.me/' + d + '" target="_blank" rel="noopener">Zalo</a>' : '') +
  '</div>';
}
function listCard(h, opts) {
  opts = opts || {};
  const loai = isLoai(h);
  const pm = perm2(h);
  return '<article class="card' + (loai ? " loai" : "") + '">' +
    '<div class="top"><span class="rank">#' + h.rank + '</span>' +
    '<div><span class="price">' + (h.priceText ? esc(h.priceText) + ' tỷ' : 'Chưa rõ giá') + '</span>' +
    (pm ? ' <span class="perm2">· ' + pm + '</span>' : '') + '</div>' +
    '<button type="button" class="starb' + (starred.has(h.id) ? " on" : "") + '" data-star="' + esc(h.id) + '" title="Đánh dấu sao">★</button></div>' +
    (loai ? '<span class="badge-loai">ĐÃ LOẠI</span>' : '') +
    (h.images.length ? '<div class="gallery">' + h.images.map(src =>
      '<img loading="lazy" src="' + esc(src) + '" alt="Ảnh nhà">').join("") + '</div>' : '') +
    '<div class="title">' + esc(h.title) + '</div>' +
    '<div class="meta">' +
      (h.areaSqm ? '<span>' + h.areaSqm + ' m²</span>' : '') +
      (h.area ? '<span>' + esc(h.area) + '</span>' : '') +
      (h.postedDate ? '<span>Đăng: ' + esc(h.postedDate) + '</span>' : '') +
    '</div>' +
    (h.note ? '<div class="note">' + esc(h.note) + '</div>' : '') +
    (h.comment ? '<div class="comment"><span class="lbl">COMMENT CỦA ANH</span>' + esc(h.comment) + '</div>' : '') +
    '<div class="badges">' +
      '<span class="bdg' + (h.daNhan ? " done" : "") + '">' + (h.daNhan ? "✓ Đã nhắn" : "Chưa nhắn") + '</span>' +
      '<span class="bdg' + (h.daCheck ? " done" : "") + '">' + (h.daCheck ? "✓ Đã check" : "Chưa check") + '</span>' +
      (saved.has(h.id) ? '<span class="bdg done">♥ Đã lưu</span>' : '') +
    '</div>' +
    contactRow(h) +
    (opts.removable ? '<div class="mini"><a href="#" data-unsave="' + esc(h.id) + '">Bỏ khỏi Đã lưu</a></div>' : '') +
  '</article>';
}

/* ===== Deck ===== */
function deckQueue() {
  return state.houses.filter(h => !passed.has(h.id) && !saved.has(h.id));
}
function deckCard(h, behind) {
  const loai = isLoai(h);
  const pm = perm2(h);
  const imgs = h.images;
  const pi = Math.min(state.photoIdx, Math.max(0, imgs.length - 1));
  const photo = imgs.length
    ? '<img src="' + esc(imgs[pi]) + '" alt="Ảnh nhà" draggable="false">' +
      (imgs.length > 1
        ? '<button type="button" class="nav prev" data-nav="-1">‹</button>' +
          '<button type="button" class="nav next" data-nav="1">›</button>' +
          '<span class="count">' + (pi + 1) + '/' + imgs.length + '</span>' +
          '<span class="dots">' + imgs.map((_, i) => '<i class="' + (i === pi ? "on" : "") + '"></i>').join("") + '</span>'
        : '')
    : '<div class="nophoto">Căn này chưa có ảnh<br>(em đang nạp dần từng tin)</div>';
  return '<div class="dcard' + (behind ? " behind" : "") + '"' + (behind ? "" : ' id="topCard"') + '>' +
    '<div class="photo">' + photo +
      '<span class="stamp save" id="stampSave">LƯU ✓</span>' +
      '<span class="stamp pass" id="stampPass">BỎ QUA</span>' +
    '</div>' +
    '<div class="dbody">' +
      '<div><span class="dprice">' + (h.priceText ? esc(h.priceText) + ' tỷ' : 'Chưa rõ giá') + '</span>' +
      (pm ? ' <span class="dperm2">· ' + pm + '</span>' : '') +
      (loai ? '<span class="badge-loai">ĐÃ LOẠI</span>' : '') + '</div>' +
      '<div class="dtitle">#' + h.rank + ' · ' + esc(h.title) + '</div>' +
      '<div class="dmeta">' +
        (h.areaSqm ? '<span>' + h.areaSqm + ' m²</span>' : '') +
        (h.area ? '<span>' + esc(h.area) + '</span>' : '') +
        (h.postedDate ? '<span>Đăng: ' + esc(h.postedDate) + '</span>' : '') +
      '</div>' +
      (h.note ? '<div class="dnote">' + esc(h.note) + '</div>' : '') +
      contactRow(h) +
    '</div></div>';
}
function renderDeck() {
  const q = deckQueue();
  const total = state.houses.length;
  const seen = total - q.length;
  $("summary").innerHTML = "Đã xem <b>" + seen + "/" + total + "</b> · Đã lưu <b>" + saved.size +
    "</b> · Có sao <b>" + starred.size + "</b>";
  if (!q.length) {
    $("view").innerHTML = '<div class="state"><div class="big">Đã xem hết danh sách 🎉</div>' +
      'Anh đã vuốt qua toàn bộ các căn chưa lưu.<br><br>' +
      '<button type="button" id="btnResetDeck">Xem lại từ đầu (chỉ xoá lượt bỏ qua)</button></div>';
    $("btnResetDeck").addEventListener("click", () => {
      passed.clear(); state.history = []; persist(); render();
    });
    return;
  }
  const cur = q[0], next = q[1];
  $("view").innerHTML = '<div class="deckwrap">' +
    '<div class="deckmeta"><span>Căn #' + cur.rank + ' · còn ' + q.length + ' căn chưa xem</span>' +
    (state.history.length ? '<button type="button" id="btnUndo">↩ Hoàn tác</button>' : '') + '</div>' +
    '<div class="stage">' + (next ? deckCard(next, true) : '') + deckCard(cur, false) + '</div>' +
    '<div class="swipebar">' +
      '<button type="button" class="sbtn pass" id="btnPass" title="Bỏ qua">✕</button>' +
      '<button type="button" class="sbtn star' + (starred.has(cur.id) ? " on" : "") + '" id="btnStar" title="Đánh dấu sao">★</button>' +
      '<button type="button" class="sbtn save" id="btnSave" title="Lưu lại">♥</button>' +
    '</div>' +
    '<div class="swipelabels"><span>Vuốt trái · Bỏ qua</span><span>Sao · Quan tâm</span><span class="mid">Vuốt phải · Lưu</span></div>' +
  '</div>';
  $("btnPass").addEventListener("click", () => decide("pass"));
  $("btnSave").addEventListener("click", () => decide("save"));
  $("btnStar").addEventListener("click", () => {
    starred.has(cur.id) ? starred.delete(cur.id) : starred.add(cur.id);
    persist(); render();
  });
  const undo = $("btnUndo");
  if (undo) undo.addEventListener("click", undoLast);
  document.querySelectorAll("[data-nav]").forEach(b => {
    b.addEventListener("click", (e) => {
      e.stopPropagation();
      const n = cur.images.length;
      if (n > 1) { state.photoIdx = (state.photoIdx + Number(b.dataset.nav) + n) % n; render(); }
    });
  });
  attachSwipe(cur);
}
function decide(kind) {
  const q = deckQueue();
  if (!q.length) return;
  const cur = q[0];
  const card = $("topCard");
  const done = () => {
    if (kind === "pass") passed.add(cur.id); else saved.add(cur.id);
    state.history.push({ id: cur.id, kind });
    state.photoIdx = 0;
    persist(); render();
  };
  if (card) {
    card.style.transition = "transform .28s ease, opacity .28s ease";
    card.style.transform = "translateX(" + (kind === "pass" ? "-120" : "120") + "vw) rotate(" + (kind === "pass" ? "-10" : "10") + "deg)";
    card.style.opacity = "0.4";
    setTimeout(done, 240);
  } else done();
}
function undoLast() {
  const last = state.history.pop();
  if (!last) return;
  if (last.kind === "pass") passed.delete(last.id); else saved.delete(last.id);
  state.photoIdx = 0;
  persist(); render();
}
function attachSwipe(cur) {
  const card = $("topCard");
  if (!card) return;
  const saveStamp = $("stampSave"), passStamp = $("stampPass");
  let sx = 0, dx = 0, dragging = false;
  card.addEventListener("pointerdown", (e) => {
    if (e.target.closest("a,button")) return;
    dragging = true; sx = e.clientX; dx = 0;
    card.style.transition = "none";
    card.setPointerCapture(e.pointerId);
  });
  card.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    dx = e.clientX - sx;
    card.style.transform = "translateX(" + dx + "px) rotate(" + (dx / 18) + "deg)";
    if (saveStamp) saveStamp.style.opacity = dx > 24 ? Math.min(1, dx / 110) : 0;
    if (passStamp) passStamp.style.opacity = dx < -24 ? Math.min(1, -dx / 110) : 0;
  });
  const end = () => {
    if (!dragging) return;
    dragging = false;
    if (dx > 95) return decide("save");
    if (dx < -95) return decide("pass");
    card.style.transition = "transform .22s ease";
    card.style.transform = "";
    if (saveStamp) saveStamp.style.opacity = 0;
    if (passStamp) passStamp.style.opacity = 0;
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", end);
}

/* ===== Đã lưu ===== */
function renderSaved() {
  const list = state.houses.filter(h => saved.has(h.id));
  const stars = state.houses.filter(h => starred.has(h.id) && !saved.has(h.id));
  $("summary").innerHTML = "Đã lưu <b>" + list.length + "</b> căn · Có sao <b>" + starred.size + "</b>";
  let html = "";
  if (!list.length && !stars.length) {
    html = '<div class="state"><div class="big">Chưa lưu căn nào</div>Vuốt phải (hoặc bấm ♥) ở mục “Vuốt xem” để lưu lại căn ưng ý. Bấm ★ để đánh dấu sao các tin quan tâm.</div>';
  }
  if (list.length) html += list.map(h => listCard(h, { removable: true })).join("");
  if (stars.length) {
    html += '<div class="state" style="padding:14px"><div class="big">Tin có sao nhưng chưa lưu</div></div>' +
      stars.map(h => listCard(h, {})).join("");
  }
  $("view").innerHTML = html;
  bindCardButtons();
}

/* ===== Danh sách ===== */
function visibleList() {
  let list = state.houses.slice();
  const q = state.q.trim().toLowerCase();
  if (q) list = list.filter(h => (h.title + " " + h.area + " " + h.note + " " + h.phone).toLowerCase().includes(q));
  if (state.area) list = list.filter(h => h.area === state.area);
  if (state.maxPrice != null) list = list.filter(h => h.priceNum != null && h.priceNum <= state.maxPrice);
  if (state.hideLoai) list = list.filter(h => !isLoai(h));
  if (state.sort === "priceAsc") list.sort((a, b) => (a.priceNum ?? 1e9) - (b.priceNum ?? 1e9));
  if (state.sort === "priceDesc") list.sort((a, b) => (b.priceNum ?? -1) - (a.priceNum ?? -1));
  if (state.sort === "perm2") {
    const pm = (h) => (h.priceNum != null && h.areaSqm) ? h.priceNum * 1000 / h.areaSqm : 1e12;
    list.sort((a, b) => pm(a) - pm(b));
  }
  return list;
}
function renderList() {
  const list = visibleList();
  const areas = [...new Set(state.houses.map(h => h.area).filter(Boolean))].sort();
  $("summary").innerHTML = "Tổng <b>" + state.houses.length + "</b> căn · Đang hiển thị <b>" + list.length +
    "</b> · Đã lưu <b>" + saved.size + "</b> · Có sao <b>" + starred.size + "</b>";
  $("view").innerHTML =
    '<div class="searchrow"><input type="search" id="q" placeholder="Tìm theo tiêu đề, khu vực, ghi chú…" autocomplete="off" value="' + esc(state.q) + '">' +
    '<button id="btnFilters" type="button">Bộ lọc</button>' +
    '<button id="btnReload" type="button" title="Tải lại từ Google Sheet">↻</button></div>' +
    '<div class="filters' + (state.filtersOpen ? " open" : "") + '" id="filters">' +
      '<div class="row"><label for="fArea">Khu vực</label><select id="fArea"><option value="">Tất cả khu vực</option>' +
        areas.map(a => '<option value="' + esc(a) + '"' + (a === state.area ? " selected" : "") + '>' + esc(a) + '</option>').join("") + '</select></div>' +
      '<div class="row"><label for="fPrice">Giá tối đa (tỷ)</label><input type="number" id="fPrice" min="0" step="0.1" placeholder="VD: 7.5" inputmode="decimal" value="' + (state.maxPrice ?? "") + '"></div>' +
      '<div class="row"><label for="fSort">Sắp xếp</label><select id="fSort">' +
        '<option value="rank"' + (state.sort === "rank" ? " selected" : "") + '>Thứ hạng trong Sheet</option>' +
        '<option value="priceAsc"' + (state.sort === "priceAsc" ? " selected" : "") + '>Giá tăng dần</option>' +
        '<option value="priceDesc"' + (state.sort === "priceDesc" ? " selected" : "") + '>Giá giảm dần</option>' +
        '<option value="perm2"' + (state.sort === "perm2" ? " selected" : "") + '>Giá/m² tăng dần</option></select></div>' +
      '<div class="row"><span class="toggle' + (state.hideLoai ? " on" : "") + '" id="tHideLoai">Ẩn căn đã loại</span></div>' +
    '</div>' +
    (list.length ? list.map(h => listCard(h, {})).join("")
      : '<div class="state"><div class="big">Không có căn nào khớp bộ lọc</div>Thử nới điều kiện lọc xem sao.</div>');
  $("q").addEventListener("input", (e) => { state.q = e.target.value; renderListKeep(); });
  $("btnFilters").addEventListener("click", () => { state.filtersOpen = !state.filtersOpen; $("filters").classList.toggle("open", state.filtersOpen); });
  $("btnReload").addEventListener("click", load);
  $("fArea").addEventListener("change", (e) => { state.area = e.target.value; render(); });
  $("fPrice").addEventListener("input", (e) => { const v = parseFloat(e.target.value); state.maxPrice = isNaN(v) ? null : v; renderListKeep(); });
  $("fSort").addEventListener("change", (e) => { state.sort = e.target.value; render(); });
  $("tHideLoai").addEventListener("click", (e) => { state.hideLoai = !state.hideLoai; e.currentTarget.classList.toggle("on", state.hideLoai); renderListKeep(); });
  bindCardButtons();
}
function renderListKeep() {
  const y = window.scrollY;
  renderList();
  window.scrollTo(0, y);
}
function bindCardButtons() {
  document.querySelectorAll("[data-star]").forEach(b => {
    b.addEventListener("click", () => {
      const id = b.dataset.star;
      starred.has(id) ? starred.delete(id) : starred.add(id);
      persist(); render();
    });
  });
  document.querySelectorAll("[data-unsave]").forEach(a => {
    a.addEventListener("click", (e) => {
      e.preventDefault();
      saved.delete(a.dataset.unsave);
      persist(); render();
    });
  });
}

/* ===== Điều hướng tab ===== */
function render() {
  $("tabDeck").classList.toggle("on", state.tab === "deck");
  $("tabSaved").classList.toggle("on", state.tab === "saved");
  $("tabList").classList.toggle("on", state.tab === "list");
  if (state.tab === "deck") renderDeck();
  else if (state.tab === "saved") renderSaved();
  else renderList();
}
$("tabDeck").addEventListener("click", () => { state.tab = "deck"; state.photoIdx = 0; render(); });
$("tabSaved").addEventListener("click", () => { state.tab = "saved"; render(); });
$("tabList").addEventListener("click", () => { state.tab = "list"; render(); });

load();
</script>
</body>
</html>
